name: Publish to PyPI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voipano-python-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'voipano/python-voipano' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Lock release to triggering commit
        run: git reset --hard ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check public secrets
        run: python scripts/check-public-secrets.py

      - name: Install testing tools
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Determine and create release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: "false"
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install -e '.[dev]'

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          source = Path("src/voipano/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*["\x27]([^"\x27]+)', source)

          assert match, "Missing package version"
          assert match.group(1) == version, "Version mismatch"
          assert os.environ["RELEASE_TAG"] == "v" + version, "Tag mismatch"

          print("Validated release:", version)
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [release, build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voipano
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voipano-sdk"
version = "1.0.0"
description = "Official Python SDK for the Voipano Public API v1"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Voipano"}]
keywords = ["voipano", "voip", "telephony", "call-center", "api", "otp", "webhooks"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "twine>=5,<8"]

[project.urls]
Homepage = "https://voipano.com"
Source = "https://github.com/voipano/python-voipano"
Issues = "https://github.com/voipano/python-voipano/issues"
Documentation = "https://github.com/voipano/python-voipano#readme"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voipano = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
